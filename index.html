<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jonathan &amp; Rebecca — Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #fdf8f4;   /* warm blush cream */
    --bg-soft:   #f6ebe2;
    --ink:       #2a1f1d;
    --ink-soft:  #4a3a36;
    --muted:     #9a8278;
    --accent:    #c2545c;   /* coral pink from artwork */
    --accent-2:  #e89aa0;   /* soft pink */
    --leaf:      #7d8a5e;   /* sage green from artwork */
    --leaf-soft: #b3bc9a;
    --line:      #e4cfc1;
    --card:      #fffaf5;
    --card-edge: #ead7c6;
    --claimed:   #7d8a5e;
    --shadow:    0 1px 2px rgba(80,40,40,.04), 0 12px 36px rgba(120,60,60,.08);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Fraunces', Georgia, serif;
    font-size: 19px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      radial-gradient(800px 500px at 12% 8%,  rgba(232,154,160,.20), transparent 60%),
      radial-gradient(700px 500px at 92% 18%, rgba(179,188,154,.18), transparent 60%),
      radial-gradient(900px 600px at 50% 100%, rgba(194,84,92,.07), transparent 65%);
  }
  body::after {
    content:"";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: .3;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.10  0 0 0 0 0.10  0 0 0 0.16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ===== Floral banner (uses florals.png from repo) ===== */
  .floral-banner {
    display: block;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    height: auto;
    pointer-events: none;
    user-select: none;
  }
  .floral-banner.top    { margin-top: 30px; margin-bottom: -10px; }
  .floral-banner.bottom { margin-top: 40px; margin-bottom: 0;     transform: rotate(180deg); opacity: .85; }

  /* ===== Header ===== */
  header.hero {
    position: relative;
    text-align: center;
    padding: 10px 24px 30px;
    z-index: 2;
  }
  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: .72rem;
    letter-spacing: .42em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
  }
  h1.title {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(44px, 7.5vw, 92px);
    letter-spacing: -.01em;
    line-height: 1.02;
    margin: 0 0 14px;
    color: var(--ink);
  }
  h1.title .amp {
    display: inline-block;
    color: var(--accent);
    font-style: italic;
    font-weight: 400;
    padding: 0 .08em;
    transform: translateY(.04em);
  }
  .kicker {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: .74rem;
    letter-spacing: .42em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }
  .subtitle {
    color: var(--ink-soft);
    max-width: 560px;
    margin: 18px auto 0;
    font-size: 1.1rem;
    font-style: italic;
    font-weight: 400;
  }

  /* ===== Name input (boxed) ===== */
  .name-bar {
    position: relative;
    max-width: 440px;
    margin: 34px auto 0;
    text-align: center;
    z-index: 2;
  }
  .name-bar label {
    display: block;
    font-size: .7rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    font-family: 'Inter', sans-serif;
  }
  .name-bar .input-wrap {
    position: relative;
  }
  .name-bar input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 14px 18px 14px 44px;
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    font-style: italic;
    text-align: left;
    color: var(--ink);
    outline: none;
    transition: border-color .25s, box-shadow .25s, background .25s;
    box-shadow: 0 1px 2px rgba(80,40,40,.04);
  }
  .name-bar input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(194,84,92,.10);
    background: #fff;
  }
  .name-bar input::placeholder { color: var(--muted); font-style: italic; }
  .name-bar .input-icon {
    position: absolute;
    left: 16px; top: 50%;
    transform: translateY(-50%);
    color: var(--accent);
    opacity: .7;
    pointer-events: none;
  }

  /* ===== Grid ===== */
  main {
    position: relative;
    z-index: 2;
    max-width: 1080px;
    margin: 0 auto;
    padding: 50px 24px 30px;
  }
  .status {
    text-align: center;
    color: var(--muted);
    font-style: italic;
    padding: 40px 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 28px;
  }

  /* ===== Card ===== */
  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 2px;
    padding: 34px 30px 28px;
    box-shadow: var(--shadow);
    transition: transform .35s ease, box-shadow .35s ease;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(194,84,92,.18);
    pointer-events: none;
    border-radius: 1px;
  }
  .card .flourish {
    position: absolute;
    top: -8px; right: -12px;
    width: 120px; height: 120px;
    opacity: .18;
    color: var(--leaf);
    pointer-events: none;
    transition: opacity .4s, transform .6s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 4px 14px rgba(120,60,60,.08), 0 22px 50px rgba(120,60,60,.12);
  }
  .card:hover .flourish { opacity: .32; transform: rotate(8deg); }

  .card h3 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 1.7rem;
    letter-spacing: .005em;
    line-height: 1.15;
    margin: 0 0 10px;
    color: var(--ink);
    position: relative;
  }
  .card .underline {
    width: 32px;
    height: 1px;
    background: var(--accent);
    margin: 0 0 16px;
    position: relative;
  }
  .card .underline::after {
    content:"";
    position: absolute;
    left: 36px; top: -2px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }
  .card .details {
    color: var(--ink-soft);
    font-size: 1.02rem;
    line-height: 1.55;
    flex: 1;
    margin-bottom: 22px;
    white-space: pre-wrap;
    word-wrap: break-word;
    position: relative;
  }
  .card .details a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(194,84,92,.3);
    transition: border-color .2s;
  }
  .card .details a:hover { border-bottom-color: var(--accent); }

  .btn {
    appearance: none;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    padding: 12px 16px;
    font-family: 'Inter', sans-serif;
    font-size: .72rem;
    font-weight: 500;
    letter-spacing: .26em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 1px;
    transition: background .25s, color .25s, letter-spacing .25s;
    position: relative;
    z-index: 1;
  }
  .btn:hover {
    background: var(--accent);
    color: var(--card);
    letter-spacing: .3em;
  }
  .btn:disabled { opacity: .6; cursor: wait; }

  .card.claimed { background: #f6ede4; }
  .card.claimed::before { border-color: rgba(125,138,94,.30); }
  .card.claimed h3 { color: var(--ink-soft); }
  .card .claimed-tag {
    font-family: 'Inter', sans-serif;
    font-size: .68rem;
    font-weight: 500;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--claimed);
    margin: 4px 0 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .card .claimed-tag::before {
    content:""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--claimed);
  }
  .card .claimed-by {
    font-style: italic;
    color: var(--ink-soft);
    margin-bottom: 18px;
    font-size: 1rem;
  }
  .btn.ghost {
    border-color: var(--line);
    color: var(--muted);
  }
  .btn.ghost:hover {
    background: var(--bg-soft);
    color: var(--ink);
    border-color: var(--ink-soft);
    letter-spacing: .3em;
  }

  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg);
    padding: 13px 24px;
    border-radius: 1px;
    font-family: 'Inter', sans-serif;
    font-size: .76rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s, transform .3s;
    z-index: 50;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 10px 24px 50px;
    color: var(--muted);
    font-style: italic;
    font-size: 1rem;
  }

  .card { opacity: 0; transform: translateY(10px); animation: rise .7s ease forwards; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<img class="floral-banner top" src="florals.png" alt="" />

<header class="hero">
  <div class="eyebrow">The Wedding of</div>
  <h1 class="title">Jonathan <span class="amp">&amp;</span> Rebecca</h1>
  <div class="kicker">Our Registry</div>
  <p class="subtitle">With so much gratitude — please choose anything that speaks to you, and mark it claimed so no one doubles up.</p>

  <div class="name-bar">
    <label for="guest-name">Your name (optional)</label>
    <div class="input-wrap">
      <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <input id="guest-name" type="text" placeholder="So we know who to thank" autocomplete="name" />
    </div>
  </div>
</header>

<main>
  <div id="status" class="status">Loading the registry…</div>
  <div id="grid" class="grid" style="display:none"></div>
</main>

<img class="floral-banner bottom" src="florals.png" alt="" />

<footer>With love — thank you for celebrating with us.</footer>

<div id="toast" class="toast"></div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzdOjoYPwhmOKh34QCZMeCyEFpN1Z6oryd5dq7xqTISzUMLlqwJOyphStzr00_g2gAr/exec";

  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const nameInput = document.getElementById('guest-name');
  const toastEl = document.getElementById('toast');

  nameInput.value = localStorage.getItem('registry_name') || '';
  nameInput.addEventListener('input', () => {
    localStorage.setItem('registry_name', nameInput.value.trim());
  });

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function linkify(text) {
    const esc = escapeHtml(text);
    return esc.replace(/(https?:\/\/[^\s<]+)/g,
      '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  async function api(action, params = {}) {
    const url = new URL(API_URL);
    url.searchParams.set('action', action);
    Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
    const res = await fetch(url.toString(), { method: 'GET' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  async function load() {
    try {
      const data = await api('list');
      render(data.items);
    } catch (e) {
      status.textContent = 'Could not load registry: ' + e.message;
    }
  }

  const FLOURISH_SVG = `
    <svg class="flourish" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.2" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 5 C 60 25, 75 35, 95 45"/>
      <path d="M50 5 C 40 25, 25 35, 5 45"/>
      <path d="M50 5 C 50 30, 50 55, 50 85"/>
      <ellipse cx="70" cy="22" rx="6" ry="2.5" transform="rotate(40 70 22)" fill="currentColor"/>
      <ellipse cx="30" cy="22" rx="6" ry="2.5" transform="rotate(-40 30 22)" fill="currentColor"/>
      <ellipse cx="85" cy="40" rx="5" ry="2" transform="rotate(20 85 40)" fill="currentColor"/>
      <ellipse cx="15" cy="40" rx="5" ry="2" transform="rotate(-20 15 40)" fill="currentColor"/>
      <circle cx="50" cy="50" r="4" fill="currentColor"/>
    </svg>`;

  function render(items) {
    if (!items.length) {
      status.textContent = 'No items yet.';
      return;
    }
    status.style.display = 'none';
    grid.style.display = 'grid';
    grid.innerHTML = '';
    items.forEach((it, i) => {
      const card = document.createElement('article');
      card.className = 'card' + (it.claimedBy ? ' claimed' : '');
      card.style.animationDelay = (i * 50) + 'ms';

      const claimedBlock = it.claimedBy
        ? `<div class="claimed-tag">Spoken For</div>
           <div class="claimed-by">${ it.claimedBy && it.claimedBy !== 'Anonymous' ? 'by ' + escapeHtml(it.claimedBy) : 'by a guest' }</div>
           <button class="btn ghost" data-action="unclaim" data-id="${escapeHtml(it.id)}">Unclaim</button>`
        : `<button class="btn" data-action="claim" data-id="${escapeHtml(it.id)}">I'll bring this</button>`;

      card.innerHTML = `
        ${FLOURISH_SVG}
        <h3>${escapeHtml(it.name)}</h3>
        <div class="underline"></div>
        <div class="details">${linkify(it.details || '')}</div>
        ${claimedBlock}`;
      grid.appendChild(card);
    });

    grid.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', onAction);
    });
  }

  async function onAction(e) {
    const btn = e.currentTarget;
    const action = btn.dataset.action;
    const id = btn.dataset.id;
    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = action === 'claim' ? 'Claiming…' : 'Unclaiming…';
    try {
      const who = nameInput.value.trim();
      const res = await api(action, { id, who });
      if (res.item && res.item.alreadyClaimed) {
        toast('Just claimed — refreshing');
      } else {
        toast(action === 'claim' ? 'Thank you!' : 'Unclaimed');
      }
      await load();
    } catch (err) {
      toast('Error: ' + err.message);
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  load();
</script>
</body>
</html>
